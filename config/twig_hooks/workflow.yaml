sylius_twig_hooks:
    hooks:
        'sylius_admin.workflow.show.content.header':
            breadcrumbs:
                template: '@SyliusAdmin/shared/crud/show/content/header/breadcrumbs.html.twig'
                configuration:
                    rendered_field: name

        'sylius_admin.workflow.show.content.header.title_block':
            actions:
                template: '@BoutDeCodeSyliusETLPlugin/admin/workflow/show/actions.html.twig'
                priority: -10

        'sylius_admin.workflow.show.content':
            details:
                template: '@BoutDeCodeSyliusETLPlugin/admin/workflow/show/details.html.twig'
                priority: 100
            pipelines:
                template: '@BoutDeCodeSyliusETLPlugin/admin/workflow/show/pipelines.html.twig'
                priority: 90
